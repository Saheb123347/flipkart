<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flipkart | Big Dhamaka Days Sale</title>
<style>
:root{
  --bg:#f6f3ee; --surface:#ffffff; --ink:#1d1b19; --muted:#6b655e; --line:#e2dcd2;
  --accent:#0b5d4b; --accent-ink:#ffffff; --warn:#b3341f; --price:#0b5d4b;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16140f; --surface:#211e18; --ink:#f1ece3; --muted:#a39b8e; --line:#3a352b;
    --accent:#4fc3a1; --accent-ink:#0d1f19; --warn:#ff8a73; --price:#4fc3a1;
  }
}
:root[data-theme="dark"]{
  --bg:#16140f; --surface:#211e18; --ink:#f1ece3; --muted:#a39b8e; --line:#3a352b;
  --accent:#4fc3a1; --accent-ink:#0d1f19; --warn:#ff8a73; --price:#4fc3a1;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background-color:var(--bg);
  background-image:radial-gradient(color-mix(in srgb,var(--ink) 9%,transparent) 1px,transparent 1.5px);background-size:22px 22px;color:var(--ink);
  font-family:"Hind","Noto Sans Devanagari","Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.55}
h1,h2,h3{font-family:"Fraunces","Georgia","Times New Roman",serif;line-height:1.2;margin:0 0 .5em;letter-spacing:-.01em}
a{color:inherit}
button,input,textarea,select{font:inherit;color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px}
header.top{border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;gap:12px}
.brand{font-family:"Fraunces",Georgia,serif;font-weight:700;font-size:1.3rem;text-decoration:none}
nav{display:flex;gap:6px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);
  padding:9px 16px;border-radius:8px;cursor:pointer;text-decoration:none;font-weight:600}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn.small{padding:5px 10px;font-size:.9rem}
.btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.badge{background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:0 8px;font-size:.8rem;margin-left:4px}
.hero{padding:44px 0 26px}
.hero h1{font-size:clamp(1.9rem,5vw,3rem);max-width:16ch}
.hero p{color:var(--muted);max-width:52ch;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;padding:10px 0 50px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.card .pic{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-size:4rem;background:var(--tint,#ece6da);cursor:pointer;overflow:hidden}
.card .pic img{width:100%;height:100%;object-fit:cover}
.card .body{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{font-size:1.02rem;margin:0;font-family:inherit;font-weight:600}
.price{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.price b{font-size:1.25rem;color:var(--price)}
.price s{color:var(--muted);font-size:.9rem}
.price span{color:var(--warn);font-size:.9rem;font-weight:600}
.card .actions{display:none}
.card .actions .btn{flex:1}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:18px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:720px){.two{grid-template-columns:1fr}}
label{display:block;font-weight:600;margin:12px 0 4px;font-size:.95rem}
input[type=text],input[type=number],input[type=password],input[type=tel],input[type=url],textarea,select{
  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
textarea{min-height:120px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.88rem}
.hint{color:var(--muted);font-size:.88rem;margin:4px 0 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.cartpic{width:52px;height:52px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.8rem;background:var(--tint,#ece6da);overflow:hidden;flex:none}
.cartpic img{width:100%;height:100%;object-fit:cover}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:30px;height:30px;border-radius:6px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.pay-opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px;cursor:pointer}
.pay-opt input{margin-top:5px}
.pay-opt.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.note{background:color-mix(in srgb,var(--warn) 10%,transparent);border:1px solid var(--warn);border-radius:8px;padding:10px 12px;font-size:.9rem}
.ok{background:color-mix(in srgb,var(--accent) 10%,transparent);border:1px solid var(--accent);border-radius:8px;padding:10px 12px}
.detail{display:grid;grid-template-columns:1fr 1fr;gap:28px;padding:30px 0}
@media(max-width:720px){.detail{grid-template-columns:1fr}}
.detail .big{aspect-ratio:1/1;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:8rem;background:var(--tint,#ece6da);overflow:hidden}
.detail .big img{width:100%;height:100%;object-fit:cover}

/* Product detail gallery: main photo plus extra image thumbnails */
.product-gallery{min-width:0}
.product-gallery .big{aspect-ratio:1/1;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:8rem;background:var(--tint,#ece6da);overflow:hidden}
.product-gallery .big img{width:100%;height:100%;object-fit:contain}
.product-thumbs{display:flex;gap:9px;overflow-x:auto;padding:10px 2px 4px;scrollbar-width:thin}
.product-thumb{position:relative;flex:0 0 76px;width:76px;height:76px;border:1px solid #dedede;border-radius:9px;background:#fff;display:grid;place-items:center;overflow:hidden;color:#6b7280;cursor:pointer;font-size:1.5rem}
.product-thumb.active{border:2px solid #2875f0}
.product-thumb img{width:100%;height:100%;object-fit:contain}
.product-thumb.add{font-size:.7rem;line-height:1.2;border-style:dashed;gap:2px}
.product-thumb.add span{font-size:1.5rem}
.product-thumb input{display:none}
@media(max-width:720px){.product-gallery .big{aspect-ratio:1/1;max-height: min(92vw,520px)}.product-thumb{flex-basis:68px;width:68px;height:68px}}

body.hasimg{background-image:var(--bgimg);background-size:cover;background-position:center;background-attachment:fixed}
body.hasimg main.wrap{background:color-mix(in srgb,var(--bg) 88%,transparent);border-radius:14px;margin-top:14px;margin-bottom:14px}
footer{border-top:1px solid var(--line);color:var(--muted);padding:22px 0;font-size:.9rem}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tabs .btn[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.scroll{overflow-x:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;z-index:20}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .2s ease-out}@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}}}

/* ---- Big Dhamaka Days sale theme ---- */
.sbar{background:#1a1200;color:#ffd500;text-align:center;font-weight:800;font-size:.85rem;padding:6px 10px;letter-spacing:.04em;overflow:hidden;white-space:nowrap}
.sale{margin:18px 0 8px;border-radius:18px;padding:30px 24px;color:#fff;background:linear-gradient(120deg,#1d2bd8,#6a1fd0 60%,#d61f8b);position:relative;overflow:hidden}
.sale::after{content:"💥";position:absolute;right:14px;top:6px;font-size:6rem;opacity:.25}
.sale .tag{display:inline-block;background:#ffd500;color:#1a1200;font-weight:900;padding:4px 12px;border-radius:99px;font-size:.8rem;letter-spacing:.06em}
.sale h1{font-size:clamp(2rem,7vw,3.6rem);margin:12px 0 4px;color:#fff;max-width:none;font-weight:900}
.sale h1 em{color:#ffd500;font-style:normal}
.sale p{margin:0 0 16px;color:#f0e9ff;max-width:46ch}
.cd{display:flex;gap:8px;margin-bottom:18px}
.cd div{background:rgba(0,0,0,.35);border-radius:10px;min-width:62px;text-align:center;padding:8px 6px}
.cd b{display:block;font-size:1.6rem;font-variant-numeric:tabular-nums;color:#ffd500}
.cd small{font-size:.7rem;color:#e6dcff;text-transform:uppercase;letter-spacing:.08em}
.sale .btn{background:#ffd500;color:#1a1200;border-color:#ffd500;font-weight:800}
.offers{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.offers div{background:var(--surface);border:1px dashed var(--accent);border-radius:12px;padding:12px;text-align:center;font-size:.9rem}
.offers b{display:block;font-size:1.05rem;color:var(--price)}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:26px 0 10px}
.sec h2{margin:0;font-size:1.5rem}
.sec span{color:var(--muted);font-size:.85rem}
.strip{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x mandatory}
.deal{flex:0 0 160px;scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;text-decoration:none;overflow:hidden;position:relative}
.deal .pic{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-size:3.2rem;background:var(--tint,#ece6da)}
.deal .pic img{width:100%;height:100%;object-fit:cover}
.deal div.t{padding:8px 10px;font-size:.88rem}
.deal .t b{display:block;color:var(--price);font-size:1rem}
.off{position:absolute;left:0;top:10px;background:#e11d48;color:#fff;font-weight:900;font-size:.75rem;padding:3px 9px;border-radius:0 6px 6px 0;z-index:1}
.card{position:relative}
.card .off{top:12px}
.card .price span{display:none}
.card:hover{box-shadow:0 6px 20px rgba(0,0,0,.15);transform:translateY(-2px)}
@media (prefers-reduced-motion:no-preference){.card{transition:.15s}}
@media(max-width:560px){.grid{grid-template-columns:1fr 1fr;gap:4px}.card .pic{font-size:3rem}.card .body{padding:10px}.card h3{font-size:.92rem}.card .actions{flex-direction:column}.card .actions .btn{width:100%}.card .price b{font-size:1rem}.sale{padding:24px 18px}.hero{padding-top:20px}}
.otimer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:15;background:#1a1200;color:#ffd500;border:2px solid #ffd500;border-radius:99px;padding:8px 18px;font-weight:700;font-size:.92rem;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.otimer b{font-size:1.1rem;font-variant-numeric:tabular-nums;color:#fff}
.otimer.done{background:#444;border-color:#888;color:#ddd}
footer{padding-bottom:80px}
.sbar{padding:0}
.sbar .track{display:inline-flex;width:max-content;animation:slide 35s linear infinite}
.sbar .track span{display:inline-block;padding:7px 0 7px 40px}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* ---- Marketplace layout ---- */
header.top{background:linear-gradient(90deg,#2f2fc9,#5b2fd0);border-bottom:0}
header.top .wrap{height:auto;padding-top:10px;padding-bottom:10px;gap:10px}
header.top .brand{color:#fff;font-style:italic;font-weight:800}
header.top .btn{background:#fff;color:#1a1200;border-color:#fff}
.hsearch{flex:1;min-width:0}
.hsearch input{width:100%;border:0;border-radius:8px;padding:10px 14px;background:#fff;color:#1a1200}
.cats{display:flex;gap:14px;overflow-x:auto;padding:14px 2px 6px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:0 0 auto;width:74px;text-align:center;background:none;border:0;cursor:pointer;font-size:.8rem;font-weight:600}
.cat i{display:flex;align-items:center;justify-content:center;width:62px;height:62px;margin:0 auto 5px;border-radius:50%;background:var(--surface);border:2px solid var(--line);font-size:1.9rem;font-style:normal}
.cat[aria-selected="true"] i{border-color:#5b2fd0;box-shadow:0 0 0 3px rgba(91,47,208,.25)}
.car{overflow:hidden;border-radius:14px;margin:8px 0;position:relative}
.slides{display:flex;transition:transform .6s ease}
.slide{flex:0 0 100%;min-height:200px;padding:24px 20px 34px;color:#fff;display:flex;flex-direction:column;justify-content:center;gap:6px}
.slide h2{font-size:clamp(1.6rem,6vw,2.6rem);margin:0;color:#fff;font-weight:900}
.slide h2 em{font-style:normal;color:#ffd500}
.slide p{margin:0;color:#f3eeff}
.slide .btn{align-self:flex-start;background:#ffd500;color:#1a1200;border-color:#ffd500;font-weight:800;margin-top:8px}
.s1{background:linear-gradient(120deg,#1d2bd8,#6a1fd0 60%,#d61f8b)}
.s2{background:linear-gradient(120deg,#0f766e,#2563eb)}
.s3{background:linear-gradient(120deg,#c2410c,#be123c)}
.dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:6px}
.dots i{width:8px;height:8px;border-radius:99px;background:rgba(255,255,255,.5);cursor:pointer}
.dots i.on{width:22px;background:#ffd500}
.cd.mini{margin:6px 0 0}.cd.mini div{min-width:52px;padding:5px}.cd.mini b{font-size:1.2rem}
.slide.has{background-size:contain;background-repeat:no-repeat;background-position:center;background-color:#fff}.slides .slide:nth-child(1).has>*{visibility:hidden}.slide.has h2,.slide.has p,.slide.has .cd{ text-shadow:0 2px 5px rgba(0,0,0,.75)}.slide.has:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.35),rgba(0,0,0,.04));pointer-events:none}.slide{position:relative}.slide>*{position:relative;z-index:1}

.burger{background:none;border:0;color:#fff;font-size:1.7rem;line-height:1;cursor:pointer;padding:4px 6px;position:relative}
.burger b{position:absolute;top:-2px;right:-4px;background:#ffd500;color:#1a1200;border-radius:99px;font-size:.65rem;padding:1px 5px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:none}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(82vw,310px);background:var(--surface);z-index:41;transform:translateX(-105%);transition:transform .25s;overflow-y:auto;box-shadow:4px 0 24px rgba(0,0,0,.35);padding-bottom:30px}
.drawer.open{transform:none}.ov.open{display:block}
.drawer .dh{background:linear-gradient(120deg,#2f2fc9,#5b2fd0);color:#fff;padding:calc(22px + env(safe-area-inset-top,0px)) 18px 18px}
.drawer .dh b{font-size:1.15rem;display:block}
.drawer a.mi{display:flex;align-items:center;gap:12px;padding:14px 18px;text-decoration:none;border-bottom:1px solid var(--line);font-weight:600}
.drawer a.mi span.n{margin-left:auto;background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:0 8px;font-size:.8rem}
.wish{position:absolute;right:10px;top:10px;z-index:2;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.92);font-size:1.1rem;cursor:pointer;color:#555}
.wish.on{color:#e11d48}
.nt{display:flex;gap:12px;padding:14px;border-bottom:1px solid var(--line)}

/* ---- White page background (light, also on dark-mode phones) ---- */
:root{--bg:#ffffff;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#ffffff;--surface:#ffffff;--ink:#1d1b19;--muted:#6b655e;--line:#e2dcd2;--accent:#0b5d4b;--accent-ink:#ffffff;--warn:#b3341f;--price:#0b5d4b}}
body{background-color:#ffffff;background-image:none}
.card{box-shadow:0 1px 4px rgba(0,0,0,.08);border-radius:2px}.card .pic{border-radius:0;aspect-ratio:1/1.05}.card .body{gap:5px}.card h3{font-weight:500;line-height:1.35}
.assured{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:800;font-style:italic;color:#4a2bc0;margin-top:2px}
.assured b{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;background:#4a2bc0;color:#fff;font-size:.65rem;font-style:normal}
.assured i{color:#c2185b}

/* Compact image-only banner slider and smaller sale badges */
.car{border-radius:10px;margin:8px 0 10px;overflow:hidden;background:#fff}
.slides{align-items:stretch}
.slide{min-height:0;height:clamp(150px, 48vw, 300px);padding:0;position:relative;display:block;background-color:#fff}

}


/* Checkout flow styled to match the supplied mobile reference while retaining Jhamru branding. */
.checkout-flow{max-width:820px;margin:0 auto;padding:0 0 110px;background:#f0f2f5;color:#20252b;min-height:75vh}
.co-head{display:flex;align-items:center;gap:12px;background:#2864df;color:#fff;padding:18px 22px;border-radius:0 0 22px 22px;font-size:1.25rem;min-height:82px}
.co-head a{display:grid;place-items:center;width:48px;height:48px;border-radius:15px;background:#ffffff30;color:#fff;text-decoration:none;font-size:2rem;line-height:1}
.co-steps{display:flex;align-items:center;justify-content:center;gap:8px;background:#fff;border-radius:24px;margin:12px 14px 18px;padding:18px 10px;color:#8b929c}
.co-steps span{display:flex;align-items:center;flex-direction:column;font-size:1.2rem;min-width:68px}.co-steps small{font-size:.8rem;margin-top:3px}.co-steps .done{color:#285bd4}.co-steps i{height:2px;background:#d5d9e0;flex:1;max-width:90px}

function inject(html, where, tag){
  document.querySelectorAll('[data-injected="'+tag+'"]').forEach(n=>n.remove());
  if(!html.trim()) return;
  const tpl = document.createElement('template'); tpl.innerHTML = html;
  Array.from(tpl.content.childNodes).forEach(node=>{
    let el = node;
    if(node.nodeName==='SCRIPT'){
      el = document.createElement('script');
      for(const a of node.attributes) el.setAttribute(a.name,a.value);
      el.textContent = node.textContent;
    }
    if(el.nodeType===1){ el.setAttribute('data-injected',tag); }
    try{ where.appendChild(el); }catch(e){}
  });
}

function bulkPrice(dir){

function shrink(file,max){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onerror=rej;
    r.onload=()=>{ const im=new Image(); im.onerror=rej; im.onload=()=>{
      max=max||500; const k=Math.min(1,max/Math.max(im.width,im.height));
      const c=document.createElement('canvas'); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',.8)); };
      im.src=r.result; };
    r.readAsDataURL(file);
  });
}

  if($('#prm')?.checked) p.img='';
  const f=$('#pi').files[0];
  if(f){ try{ p.img = await shrink(f); }catch(e){ toast('Could not load the photo'); } }
  if(editing==='new') db.products.push(p);
  if(save()){ editing=null; toast('Product saved'); render(); }
}

    <label style="font-weight:400"><input type="checkbox" id="s6" ${s.upiEnabled?'checked':''}> UPI enabled</label>
    <div class="two"><div><label for="s7">WhatsApp number (with country code)</label><input id="s7" type="text" value="${esc(s.whatsapp)}" placeholder="91XXXXXXXXXX"></div>
    <div><label for="s8">Telegram link</label><input id="s8" type="url" value="${esc(s.telegram)}" placeholder="https://t.me/..."></div></div>
    <h2 style="font-size:1.2rem;margin-top:22px">Background</h2>
    <label style="font-weight:400"><input type="checkbox" id="sbu" ${s.bgColor?'checked':''}> Use my own background color</label>
    <input id="sbc" type="color" value="${esc(s.bgColor||'#f6f3ee')}" style="width:80px;height:40px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--bg)">
    <label for="sbi">Background photo upload (optional)</label><input id="sbi" type="file" accept="image/*">
    <p class="hint">${s.bgImg?'A photo is currently set.':'No photo set.'} When a photo is set, a light overlay sits behind the content so the text stays readable.</p>
    ${s.bgImg?'<label style="font-weight:400"><input type="checkbox" id="sbr"> Remove background photo</label>':''}
    <h2 style="font-size:1.2rem;margin-top:22px">Banner pictures (sliding banner)</h2>
    ${[0,1,2].map(i=>`<label for="bn${i}">Slide ${i+1} picture</label><input id="bn${i}" type="file" accept="image/*">${(s.banners||[])[i]?`<label style="font-weight:400"><input type="checkbox" id="bnr${i}"> Remove slide ${i+1} picture</label>`:''}`).join('')}
    <p class="hint">Use a wide picture (about 1200 x 500). The slide text stays on top of it.</p>
    <label for="s9">Admin password</label><input id="s9" type="text" value="${esc(s.adminPass)}">
    <p class="hint">This password lives only in the page code, so do not treat it as strong security. Anyone can view the page code.</p>
    <button class="btn primary" style="margin-top:12px" onclick="saveSettings()">Save</button></div>`;
}
async function saveSettings(){
  const s=db.settings;
  s.storeName=$('#s1').value.trim()||'Flipkart'; s.tagline=$('#s2').value.trim();
  s.upiId=$('#s3').value.trim(); s.upiName=$('#s4').value.trim();
  s.codEnabled=$('#s5').checked; s.upiEnabled=$('#s6').checked;
  s.whatsapp=$('#s7').value.trim(); s.telegram=$('#s8').value.trim();
  s.adminPass=$('#s9').value||'admin123';
  s.bgColor = $('#sbu').checked ? $('#sbc').value : '';
  if($('#sbr')?.checked) s.bgImg='';
  const bf=$('#sbi').files[0];
  if(bf){ try{ s.bgImg = await shrink(bf,1400); }catch(e){ toast('Could not load the background photo'); } }
  s.banners = s.banners||['','',''];
  for(let i=0;i<3;i++){ if($('#bnr'+i)?.checked) s.banners[i]=''; const f=$('#bn'+i)?.files[0]; if(f){ try{ s.banners[i]=await shrink(f,1200); }catch(e){ toast('Could not load slide '+(i+1)+' picture'); } } }
  if(!s.codEnabled && !s.upiEnabled){ s.codEnabled=true; toast('At least one payment option must stay enabled'); }
  if(save()){ document.title=s.storeName; applyBg(); toast('Settings saved'); render(); }
}

/* ---------- Render ---------- */
function render(){
  const r = route(); let html='';
  if(r.name==='home') html=pageHome();
  else if(r.name==='product') html=pageProduct(r.arg);
  else if(r.name==='cart') html=pageCart();
  else if(r.name==='checkout') html=pageCheckout();
  else if(r.name==='order-summary') html=pageOrderSummary();
  else if(r.name==='payment') html=pagePayment();
  else if(r.name==='thanks') html=pageThanks(r.arg);
  else if(r.name==='admin') html=pageAdmin();
  else if(r.name==='login') html=pageLogin();
  else if(r.name==='orders') html=pageOrders();
  else if(r.name==='wishlist') html=pageWishlist();
  else if(r.name==='notifications') html=pageNotifications();
  else if(r.name==='help') html=pageHelp();
  else html=pageHome();
  if(html) $('#app').innerHTML = html;
  document.title = db.settings.storeName + ' | Big Dhamaka Days Sale';
  tickCD();
  const q=$('#upiqr');
  if(q){ try{ drawQR(q,q.dataset.link,170); }catch(e){ q.remove(); } }
}
render();
applyBg();
applyScripts();
</script>
</body>
</html>
